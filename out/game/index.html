<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ION DRIFT</title>
<link rel="icon" href="data:,">
<meta name="description" content="ION DRIFT: a top-down arcade survival game. Harvest ion crystals, survive five waves, kill the Warden.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04060e; }
  #game {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    background: #04060e; touch-action: none; cursor: crosshair;
  }
  /* Read aloud, never shown: the line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="ION DRIFT: pilot a mining skiff through a collapsing nebula, harvest ion crystals, survive five waves and destroy the Warden. Move with WASD, aim with the mouse, fire with Space, dash with Shift."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
